[project]
name = "stv-pipeline"
version = "0.1.0"
description = "Speech-to-video pipeline: record, transcribe, plan, then generate image, voice, and video."
readme = "README.md"
authors = [
    { name = "JingJerryYao", email = "24014179g@connect.polyu.hk" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
]

[project.scripts]
stv-pipeline = "stv_pipeline.main:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
